name: Financial Close Reporting Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-reporting-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run reporting pipeline
        run: python run_pipeline.py

      - name: Run automated tests
        run: pytest -v

      - name: Upload generated management report
        uses: actions/upload-artifact@v4
        with:
          name: financial-close-management-report
          path: reports/financial_close_controls_report.xlsx